<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>امتحان | أكاديمية أبو كامل</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-protected>

<header class="site">
  <div class="brand">أكاديمية <span>أبو كامل</span></div>
  <nav class="site">
    <a href="index.html">الرئيسية</a>
    <span id="nav-user" style="display:none;font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:#d98e2b;"></span>
    <a href="#" id="nav-logout" onclick="logout()" style="display:none">خروج</a>
  </nav>
</header>

<main>
  <section class="hero">
    <h1 id="quiz-title">—</h1>
    <p>عدد الأسئلة: <span id="quiz-count">0</span></p>
  </section>

  <div id="quiz-area">
    <form id="quiz-form">
      <div id="quiz-questions"></div>
      <button type="submit" class="primary" style="max-width:220px">سلّم الإجابات</button>
    </form>
    <div id="quiz-result" style="display:none;text-align:center;padding:30px;background:#fff;border:1px solid #d8d2c0"></div>
  </div>
</main>

<footer class="site">أكاديمية أبو كامل — محتوى تعليمي للمعهد الفني الصناعي</footer>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="content-data.js"></script>
<script src="quiz-engine.js"></script>
<script>
qzStart();
document.getElementById("quiz-form").addEventListener("submit", qzSubmit);
</script>
</body>
</html>
