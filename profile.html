<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حسابي | أكاديمية أبو كامل</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-protected>

<header class="site">
  <div class="brand">أكاديمية <span>أبو كامل</span></div>
  <nav class="site">
    <a href="index.html">الرئيسية</a>
    <a href="ranking.html" id="nav-ranking">الترتيب</a>
    <span class="avatar-badge" id="nav-avatar-badge" style="display:none"></span>
    <span id="nav-user" style="display:none;font-family:'IBM Plex Mono',monospace;font-size:.82rem;color:var(--amber);margin-inline-start:8px;"></span>
    <a href="#" id="nav-logout" onclick="logout()">خروج</a>
  </nav>
</header>

<main>
  <section class="hero">
    <h1>حسابي</h1>
    <p>عدّل اسمك الظاهر وصورة البروفايل اللي هتبان للطلاب التانيين في لوحة الترتيب</p>
  </section>

  <div class="panel-box" style="max-width:480px">
    <div class="current-avatar-preview" id="current-avatar">🧑‍🎓</div>

    <label for="display-name">الاسم الظاهر</label>
    <input type="text" id="display-name" maxlength="30" placeholder="اكتب اسمك">

    <label style="margin-top:22px">ارفع صورتك من جهازك</label>
    <input type="file" id="photo-input" accept="image/*">
    <label>أو اختر رمز</label>
    <div class="avatar-grid" id="avatar-grid"></div>

    <button class="primary" id="save-btn">حفظ التغييرات</button>
    <div class="msg" id="msg-box"></div>
  </div>
</main>

<footer class="site">أكاديمية أبو كامل — محتوى تعليمي للمعهد الفني الصناعي</footer>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const AVATARS = ["🧑‍🎓","👨‍💻","👩‍💻","🦾","🧠","⚙️","💡","🔧","📐","🖥️","🚀","🎯","📘","🔬","🛠️","⭐"];

let selectedAvatar = AVATARS[0];

function renderAvatarGrid() {
  const grid = document.getElementById("avatar-grid");
  grid.innerHTML = "";
  AVATARS.forEach(function (a) {
    const div = document.createElement("div");
    div.className = "avatar-option" + (a === selectedAvatar ? " selected" : "");
    div.textContent = a;
    div.onclick = function () {
      selectedAvatar = a;
      document.getElementById("current-avatar").textContent = a;
      renderAvatarGrid();
    };
    grid.appendChild(div);
  });
}

document.getElementById("photo-input").addEventListener("change", function (e) {
  const file = e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = function () {
    const c = document.createElement("canvas");
    c.width = c.height = 128;
    const s = Math.min(img.width, img.height);
    c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 128, 128);
    selectedAvatar = c.toDataURL("image/jpeg", 0.8);
    document.getElementById("current-avatar").innerHTML = avatarHtml(selectedAvatar);
    renderAvatarGrid();
  };
  img.src = URL.createObjectURL(file);
});

auth.onAuthStateChanged(function (user) {
  if (!user) return;
  db.collection("students").doc(user.uid).get().then(function (doc) {
    const data = doc.exists ? doc.data() : {};
    selectedAvatar = data.avatar || AVATARS[0];
    document.getElementById("current-avatar").innerHTML = avatarHtml(selectedAvatar);
    document.getElementById("display-name").value = data.displayName || user.email.split("@")[0];
    renderAvatarGrid();
  });
});

document.getElementById("save-btn").addEventListener("click", function () {
  const user = auth.currentUser;
  if (!user) return;
  const name = document.getElementById("display-name").value.trim() || user.email.split("@")[0];
  const msgBox = document.getElementById("msg-box");

  db.collection("students").doc(user.uid).set({
    email: user.email,
    displayName: name,
    avatar: selectedAvatar,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true }).then(function () {
    msgBox.className = "msg ok";
    msgBox.textContent = "اتحفظ بنجاح ✓";
  }).catch(function () {
    msgBox.className = "msg error";
    msgBox.textContent = "حصل خطأ، حاول تاني";
  });
});
</script>
</body>
</html>
