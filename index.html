<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أكاديمية أبو كامل | المعهد الفني الصناعي</title>
<meta name="description" content="شروحات ومذكرات مواد المعهد الفني الصناعي، مع حسابات طلاب، امتحانات، وترتيب المتسابقين.">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site">
  <div class="brand">أكاديمية <span>أبو كامل</span></div>
  <nav class="site">
    <a href="index.html">الرئيسية</a>
    <a href="ranking.html" id="nav-ranking" style="display:none">الترتيب</a>
    <a href="login.html" id="nav-login">تسجيل الدخول</a>
    <span class="avatar-badge" id="nav-avatar-badge" style="display:none"></span>
    <span id="nav-user" style="display:none;font-family:'IBM Plex Mono',monospace;font-size:.82rem;color:var(--amber);margin-inline-start:8px;"></span>
    <a href="profile.html" id="nav-profile" style="display:none">حسابي</a>
    <a href="#" id="nav-logout" onclick="logout()" style="display:none">خروج</a>
  </nav>
</header>

<main>
  <section class="hero">
    <h1>شروحات مواد المعهد الفني الصناعي</h1>
    <p>مذكرات، فيديوهات شرح، امتحانات بعد كل درس وكل باب، وامتحان شامل على المادة، مع ترتيب لأسرع وأفضل الطلاب.</p>
  </section>

  <section>
    <h2 style="font-size:1.2rem;margin-bottom:4px">المواد المتاحة</h2>
    <div class="grid" id="subjects-list"></div>
  </section>
</main>

<footer class="site">أكاديمية أبو كامل — محتوى تعليمي للمعهد الفني الصناعي</footer>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="content-data.js"></script>
<script>
const list = document.getElementById("subjects-list");
SUBJECTS.forEach(function (s) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <h3>${s.title}</h3>
    <p>${s.description} — ${s.chapters.length} أبواب</p>
    <a href="subject.html?subject=${s.id}">ادخل المادة ←</a>
  `;
  list.appendChild(card);
});
</script>
</body>
</html>
